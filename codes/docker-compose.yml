version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: "175245"
      MYSQL_DATABASE: uav_monitor
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./uav-backend/src/sql/uav_monitor.sql:/docker-entrypoint-initdb.d/01_uav_monitor.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p175245 --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    command:
      - sh
      - -c
      - |
        printf 'listener 1883\nallow_anonymous true\n' > /mosquitto/config/mosquitto.conf
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  uav-backend:
    image: maven:3.9.9-eclipse-temurin-17
    container_name: uav-backend
    working_dir: /app
    command:
      - mvn
      - spring-boot:run
      - -Dspring-boot.run.arguments=--spring.datasource.url=jdbc:mysql://mysql:3306/uav_monitor?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true --spring.datasource.username=root --spring.datasource.password=175245 --spring.data.redis.host=redis --mqtt.broker-url=tcp://mqtt-broker:1883
    volumes:
      - ./uav-backend:/app
      - maven_repo:/root/.m2
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt-broker:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  maven_repo:
